name: YouTube Video Factory

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Test Pixabay API
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          curl -s "https://pixabay.com/api/videos/?key=${PIXABAY_API_KEY}&q=nature&per_page=3" > pixabay.json
          cat pixabay.json

            - name: Download Pixabay clip
        run: |
          URL=$(python -c "import json; print(json.load(open('pixabay.json'))['hits'][1]['videos']['small']['url'])")
          curl -L "$URL" -o pixabay-clip.mp4
          ls -lh pixabay-clip.mp4
          
          - name: Create test video
        run: |
          ffmpeg -f lavfi -i color=c=black:s=1280x720:d=5 \
            -c:v libx264 -pix_fmt yuv420p test-video.mp4

      - name: Verify video
        run: |
          ls -lh test-video.mp4
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 test-video.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: test-video.mp4
