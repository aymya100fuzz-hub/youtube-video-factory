name: YouTube Video Factory

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget unzip

      - name: Download Piper
        run: |
          wget -q https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_linux_x86_64.tar.gz
          tar -xzf piper_linux_x86_64.tar.gz

      - name: Download voice
        run: |
          mkdir -p voice
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx -O voice/model.onnx
          wget -q https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json -O voice/model.onnx.json

      - name: Create narration
        run: |
          echo "Why do most YouTube automation channels fail? The answer is simpler than you think." > script.txt
          echo "Why do most YouTube automation channels fail? The answer is simpler than you think." | ./piper/piper --model voice/model.onnx --output_file narration.wav

      - name: Verify narration
        run: |
          ls -lh narration.wav
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 narration.wav

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: narration-test
          path: narration.wav
