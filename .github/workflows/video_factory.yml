name: YouTube Video Factory

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Search Pixabay
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          curl -s "https://pixabay.com/api/videos/?key=${PIXABAY_API_KEY}&q=nature&per_page=3" > pixabay.json

      - name: Download Pixabay clip
        run: |
          URL=$(python -c "import json; print(json.load(open('pixabay.json'))['hits'][1]['videos']['small']['url'])")
          curl -L "$URL" -o pixabay-clip.mp4
          ls -lh pixabay-clip.mp4

      - name: Create video from Pixabay clip
        run: |
          ffmpeg -i pixabay-clip.mp4 \
            -t 5 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -an \
            test-video.mp4

      - name: Verify video
        run: |
          ls -lh test-video.mp4
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            test-video.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: test-video.mp4
